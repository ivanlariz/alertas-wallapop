name: Alertas Wallapop

on:
  schedule:
    - cron: '*/10 * * * *'     # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:            # botón "Run workflow" para lanzarlo a mano
    inputs:
      prueba:
        description: 'Mandar un correo de prueba con lo que hay ahora (SI/NO)'
        default: 'NO'

permissions:
  contents: write               # para guardar vistos.json y no repetir avisos

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Buscar en Wallapop y avisar
        env:
          WATCHLIST_CSV_URL: ${{ secrets.WATCHLIST_CSV_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          PRUEBA: ${{ github.event.inputs.prueba == 'SI' && '1' || '0' }}
        run: python3 alerta_wallapop.py
      - name: Guardar anuncios ya vistos
        run: |
          git config user.name "bot-alertas"
          git config user.email "bot-alertas@users.noreply.github.com"
          git add vistos.json
          git diff --cached --quiet || (git commit -m "vistos" -q && git push -q)
