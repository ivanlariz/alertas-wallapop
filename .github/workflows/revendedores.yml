name: Ventas de revendedores

on:
  schedule:
    - cron: '17 6,14,22 * * *'    # cada 8 horas: 7:17, 15:17 y 23:17 en Madrid (horario de invierno)
  workflow_dispatch:               # botón "Run workflow" para lanzarlo a mano

concurrency:
  group: revendedores
  cancel-in-progress: false

jobs:
  revendedores:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Recordar las ventas ya vistas
        uses: actions/cache@v4
        with:
          path: .revendedores_estado.json
          key: revendedores-estado-${{ github.run_id }}
          restore-keys: revendedores-estado-
      - name: Preparar el análisis de fotos
        run: pip install -q anthropic
      - name: Mirar las ventas de los revendedores y buscar más barato
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVENDEDORES: ${{ secrets.REVENDEDORES }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          VENTANA_HORAS: '24'
          TZ: Europe/Madrid
        run: python3 revendedores.py
